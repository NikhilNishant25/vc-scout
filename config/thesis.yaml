thesis: >
  Small technical teams building agent infrastructure (permissions, payments, evals, observability)
  where a working open-source wedge precedes a paid hosted product.

window_days: 120          # repos created within this window
stars_min: 20
stars_max: 3000
topics: [ai-agents, llm-agents, mcp, agent-framework, llmops, ai-infrastructure]

weights:
  star_velocity: 0.20
  commit_cadence: 0.20
  recent_release: 0.10
  commercial_intent: 0.15
  external_pull: 0.15
  obscurity: 0.10
  contributor_breadth: 0.10

targets:
  stars_per_day: 3.0
  commits_30d: 40
  open_issues: 10
  followers_ceiling: 5000

commercial_terms: [waitlist, pricing, hosted, cloud, enterprise, "book a demo", "sign up", saas, "self-host"]

red_flags:
  name_patterns: [awesome, tutorial, course, cheatsheet, "-list$", template, boilerplate, "interview"]
  min_readme_chars: 400
